    <!-- Custom Styles -->
    <style>
        /* Modern CSS Reset and Variables */
        :root {
            --primary-color: #1e293b;
            --secondary-color: #334155;
            --accent-color: #3b82f6;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --background: #ffffff;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            
            /* Typography */
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* Layout */
            --sidebar-width: 280px;
            --content-max-width: 800px;
            --header-height: 80px;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 250ms ease;
            --transition-slow: 350ms ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--background);
            transition: opacity var(--transition-normal);
        }

        body.loading {
            opacity: 0;
        }

        /* Header Styles */
        header {
            background: var(--primary-color);
            color: white;
            padding: var(--spacing-lg) 0;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .header-logo {
            max-height: 50px;
            width: auto;
            transition: transform var(--transition-fast);
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        .header-title {
            font-family: var(--font-mono);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            margin: 0;
        }

        /* Layout Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr var(--sidebar-width);
            gap: var(--spacing-xl);
            padding: var(--spacing-xl);
            min-height: calc(100vh - var(--header-height));
        }

        /* Sidebar Styles */
        .sidebar {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            height: fit-content;
            position: sticky;
            top: calc(var(--header-height) + var(--spacing-xl));
            overflow: hidden;
        }

        .sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border);
            background: var(--background);
        }

        .sidebar-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .sidebar-content {
            padding: var(--spacing-lg);
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Search Box */
        .search-container {
            margin-bottom: var(--spacing-lg);
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1);
        }

        .search-button {
            width: 100%;
            margin-top: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        .search-button:hover {
            background: #2563eb;
        }

        /* Chapter List */
        .chapter-list {
            list-style: none;
        }

        .chapter-item {
            margin-bottom: var(--spacing-xs);
        }

        .chapter-link {
            display: block;
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.875rem;
            line-height: 1.4;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
        }

        .chapter-link:hover {
            background: var(--background);
            color: var(--text-primary);
            border-left-color: var(--accent-color);
        }

        .chapter-link.active {
            background: var(--accent-color);
            color: white;
            font-weight: 500;
            border-left-color: var(--accent-color);
        }

        /* Table of Contents */
        .toc-list {
            list-style: none;
        }

        .toc-item {
            margin-bottom: var(--spacing-xs);
        }

        .toc-link {
            display: block;
            padding: var(--spacing-xs) var(--spacing-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            line-height: 1.4;
            border-radius: 4px;
            transition: all var(--transition-fast);
        }

        .toc-link:hover {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .toc-link.active {
            background: var(--accent-color);
            color: white;
        }

        .toc-level-2 {
            margin-left: 0;
        }

        .toc-level-3 {
            margin-left: var(--spacing-md);
        }

        /* Main Content */
        .main-content {
            background: var(--background);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .content-area {
            padding: var(--spacing-2xl);
            max-width: var(--content-max-width);
            margin: 0 auto;
        }

        /* Typography in Content */
        .content-area h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: var(--spacing-xl);
            color: var(--text-primary);
        }

        .content-area h2 {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
            margin: var(--spacing-2xl) 0 var(--spacing-lg) 0;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: var(--spacing-sm);
        }

        .content-area h3 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            margin: var(--spacing-xl) 0 var(--spacing-md) 0;
            color: var(--text-primary);
        }

        .content-area h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: var(--spacing-lg) 0 var(--spacing-sm) 0;
            color: var(--text-primary);
        }

        .content-area p {
            margin-bottom: var(--spacing-lg);
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .content-area a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .content-area a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .content-area ul, .content-area ol {
            margin: var(--spacing-lg) 0;
            padding-left: var(--spacing-xl);
        }

        .content-area li {
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .content-area blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: var(--spacing-lg);
            margin: var(--spacing-xl) 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .content-area pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: var(--spacing-lg);
            overflow-x: auto;
            margin: var(--spacing-lg) 0;
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }

        .content-area code {
            background: var(--surface);
            padding: 0.125rem 0.25rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .content-area pre code {
            background: none;
            padding: 0;
        }

        /* Loading States */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Mobile Navigation */
        .mobile-nav-toggle {
            display: none;
            position: fixed;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            z-index: 200;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-fast);
        }

        .mobile-nav-toggle:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        .mobile-nav {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--primary-color);
            z-index: 150;
            padding: var(--spacing-xl);
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform var(--transition-normal);
        }

        .mobile-nav.active {
            transform: translateX(0);
        }

        .mobile-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mobile-nav-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .mobile-nav-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: 4px;
            transition: background-color var(--transition-fast);
        }

        .mobile-nav-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .mobile-chapter-list {
            list-style: none;
        }

        .mobile-chapter-item {
            margin-bottom: var(--spacing-sm);
        }

        .mobile-chapter-link {
            display: block;
            padding: var(--spacing-md);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color var(--transition-fast);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mobile-chapter-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Chapter Navigation */
        .chapter-navigation {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-md);
            margin-top: var(--spacing-2xl);
            padding-top: var(--spacing-xl);
            border-top: 1px solid var(--border);
        }

        .nav-button {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            transition: all var(--transition-fast);
        }

        .nav-button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .nav-button.hidden {
            display: none;
        }

        /* Back to Top Button */
        .back-to-top {
            position: fixed;
            bottom: var(--spacing-xl);
            right: var(--spacing-xl);
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-fast);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        /* Error States */
        .error-message {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-secondary);
        }

        .error-message h2 {
            color: var(--error);
            margin-bottom: var(--spacing-lg);
        }

        /* Search Results */
        .search-results {
            margin-bottom: var(--spacing-xl);
        }

        .search-result-item {
            padding: var(--spacing-lg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            transition: all var(--transition-fast);
        }

        .search-result-item:hover {
            border-color: var(--accent-color);
            box-shadow: var(--shadow-sm);
        }

        .search-result-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .search-result-preview {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                gap: var(--spacing-lg);
                padding: var(--spacing-lg);
            }

            .sidebar {
                display: none;
            }

            .mobile-nav-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .mobile-nav {
                display: block;
            }

            .content-area {
                padding: var(--spacing-xl);
            }

            .header-content {
                padding: 0 var(--spacing-md);
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: var(--spacing-md);
            }

            .content-area {
                padding: var(--spacing-lg);
            }

            .content-area h1 {
                font-size: 2rem;
            }

            .content-area h2 {
                font-size: 1.5rem;
            }

            .chapter-navigation {
                flex-direction: column;
            }

            .back-to-top {
                bottom: var(--spacing-lg);
                right: var(--spacing-lg);
                width: 44px;
                height: 44px;
            }
        }

        @media (max-width: 480px) {
            .header-title {
                font-size: 1.25rem;
            }

            .content-area {
                padding: var(--spacing-md);
            }

            .mobile-nav {
                padding: var(--spacing-lg);
            }
        }

        /* Skip to content for accessibility */
        .skip-to-content {
            position: absolute;
            top: -40px;
            left: 6px;
            background: var(--accent-color);
            color: white;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1000;
            transition: top var(--transition-fast);
        }

        .skip-to-content:focus {
            top: 6px;
        }

        /* Print Styles */
        @media print {
            .sidebar,
            .mobile-nav-toggle,
            .mobile-nav,
            .back-to-top,
            .chapter-navigation {
                display: none !important;
            }

            .app-container {
                grid-template-columns: 1fr;
                gap: 0;
                padding: 0;
            }

            .main-content {
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .content-area {
                padding: 0;
                max-width: none;
            }
        }

        /* Focus styles for accessibility */
        *:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        button:focus,
        input:focus,
        a:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
